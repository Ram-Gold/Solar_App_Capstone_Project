name: Supabase Database Keep-Alive

on:
  schedule:
    # Runs at 04:00 UTC every 3 days (well within Supabase's 7-day inactivity pause limit)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Enables manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Database REST Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Keep-Alive Query
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://gkrdwzbxpstpqpvqlwbt.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_v-0oU01z8p2tRSFM64sbjg_Ruqr_y9c' }}
        run: node scripts/keepalive.js
